<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- favicon：内联 SVG，黄色圆 + 白点，与主页一致 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23F5B800'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23FFFFFF'/%3E%3C/svg%3E">
<title>文章列表 · L的站点</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#26241C;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
.top{max-width:760px;margin:0 auto;padding:24px 20px 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.back{color:#D99E00;font-size:14px;font-weight:600;text-decoration:none;border-bottom:1px solid #F5B800;padding-bottom:2px}
.back:hover{color:#26241C;border-color:#26241C}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs a{font-size:14px;font-weight:600;color:#7C7561;text-decoration:none;padding:4px 14px;border:1px solid #EFE7D2;border-radius:999px;transition:color .2s,border-color .2s,background .2s}
.tabs a:hover{color:#26241C;border-color:#B9B09A}
.tabs a.on{background:#F5B800;border-color:#F5B800;color:#26241C}
.wrap{max-width:760px;margin:0 auto;padding:36px 20px 64px}
h1{font-size:28px;font-weight:900;line-height:1.4}
.desc{margin-top:8px;font-size:14px;color:#7C7561}
.list{margin-top:24px;list-style:none}
.post{display:grid;grid-template-columns:110px 1fr;gap:18px;padding:18px 0;border-bottom:1px solid #EFE7D2}
.post-date{font-size:14px;color:#7C7561;padding-top:4px}
.post h3{font-size:17px;font-weight:700;line-height:1.5}
.post h3 a{color:#26241C;text-decoration:none;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.post h3 a:hover{color:#D99E00;border-color:#F5B800}
.excerpt{margin-top:6px;font-size:14.5px;color:#7C7561}
.meta{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:13px;background:#FFF1C2;border:1px solid #EFE7D2;border-radius:4px;padding:2px 10px;color:#26241C}
.empty{margin-top:28px;padding:32px 16px;text-align:center;color:#7C7561;font-size:14px;background:#FFFBEF;border:1px dashed #EFE7D2;border-radius:8px}
.foot{border-top:1px solid #EFE7D2;padding:28px 20px 40px;text-align:center;font-size:14px;color:#7C7561}
@media (max-width:640px){.post{grid-template-columns:1fr;gap:6px}.post-date{padding-top:0}}

#bgCode{
  position:fixed; inset:0; z-index:-1;
  width:100%; height:100%;
  background:#fff;
  pointer-events:none;
  opacity:.9;
}
</style>
</head>
<body>
<canvas id="bgCode" aria-hidden="true"></canvas>
<header class="top">
  <a class="back" href="index.html">← 返回首页</a>
  <nav class="tabs">
    <a href="archive.html" id="tab-all">全部</a>
    <a href="archive.html?kind=diary" id="tab-diary">日记</a>
    <a href="archive.html?kind=notes" id="tab-notes">杂谈</a>
  </nav>
</header>
<main class="wrap">
  <h1 id="pageTitle">全部文章</h1>
  <p class="desc">按时间倒序排列。</p>
  <ul class="list" id="list"></ul>
  <p class="empty" id="empty" hidden>这里还没有内容，点击右上角「写文章」发布第一篇。</p>
</main>
<footer class="foot">© <span id="yr"></span> L的站点 · 由 GitHub Pages 驱动</footer>
<script>
var POSTS = [{"date": "2026-09-09", "title": "《回答》", "href": "posts/2026-09-09-《回答》.html", "excerpt": "作者：北岛", "tags": ["诗歌"], "kind": "notes"}];
var kind = (location.search.match(/[?&]kind=(\w+)/) || [])[1] || "all";
var TITLES = { all: "全部文章", diary: "日记", notes: "杂谈" };
document.getElementById("pageTitle").textContent = TITLES[kind] || "文章";
document.getElementById("yr").textContent = new Date().getFullYear();
var tab = document.getElementById(kind === "all" ? "tab-all" : "tab-" + kind);
if (tab) tab.className = "on";
function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
var items = kind === "all" ? POSTS : POSTS.filter(function (p) { return p.kind === kind; });
if (!items.length) { document.getElementById("empty").hidden = false; }
var list = document.getElementById("list");
items.forEach(function (p) {
  var li = document.createElement("li");
  li.className = "post";
  var tags = (p.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("");
  li.innerHTML =
    '<time class="post-date">' + esc(p.date) + "</time>" +
    '<div class="post-body"><h3><a href="' + esc(p.href) + '">' + esc(p.title) + "</a></h3>" +
    (p.excerpt ? '<p class="excerpt">' + esc(p.excerpt) + "</p>" : "") +
    '<div class="meta">' + tags + "</div></div>";
  list.appendChild(li);
});
</script>

<!-- ===== 动态代码背景脚本 ===== -->
<script>
(function () {
  "use strict";
  var cv = document.getElementById("bgCode");
  if (!cv) return;
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced) { cv.style.display = "none"; return; }   /* 用户系统关闭动画：直接静默 */
  var ctx = cv.getContext("2d");
  var DPR = window.devicePixelRatio || 1;
  var W = 0, H = 0;
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);
  /* 滚动内容：本站自己的 HTML 代码（取中间一段） */
  var src = document.documentElement.outerHTML || "";
  var codeLines = src.split("\n").map(function (l) { return l.replace(/\r$/, ""); })
    .filter(function (l) { return l.trim().length > 0; });
  var mid = Math.floor(codeLines.length / 2);
  var lines = codeLines.slice(Math.max(0, mid - 16), mid + 16);
  var lineH = 22;
  var off = 0;
  var timer = null;
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.font = "13px Consolas, 'Courier New', monospace";
    var maxChars = Math.max(40, Math.floor(W / 9));
    var y0 = 40 - off;
    for (var i = 0; i < lines.length; i++) {
      var y = y0 + i * lineH;
      if (y < -lineH || y > H + lineH) continue;
      ctx.fillStyle = "rgba(124,117,97,0.55)";          /* 行号：灰 */
      ctx.fillText(("000" + (i + 1)).slice(-3), 18, y);
      ctx.fillStyle = "rgba(217,158,0,0.55)";           /* 代码：浅黄 */
      ctx.fillText(lines[i].slice(0, maxChars), 64, y);
    }
    off += 1.35;   /* 1.5 倍速 */
    if (off >= lineH) off -= lineH;
  }
  timer = setInterval(draw, 33);
  /* 2 秒后定格：停止滚动，透明度降低 + 轻微模糊，形成磨砂玻璃纹理 */
  setTimeout(function () {
    if (timer) { clearInterval(timer); timer = null; }
    cv.style.transition = "opacity 1.4s ease, filter 1.4s ease";
    cv.style.opacity = "0.16";
    cv.style.filter = "blur(2.5px)";
  }, 2000);
})();
</script>
</body>
</html>
